# Canonical tag list for jamesm.blog.
#
# This is the enforced allowlist for post frontmatter `tags:`. A build fails
# (see scripts/validate-tags.py, run from deploy.sh) if any post uses a tag
# that is not listed here - that is deliberate. It stops one-off tags from
# quietly piling up post by post (457 tags, a third used exactly once, was
# the state this replaced - see CHANGELOG).
#
# To add a tag: use it in a post's frontmatter, then add it below in the
# right alphabetical place. Prefer reusing an existing tag over adding a new
# one - a new tag is worth adding only if you expect more than one post to
# eventually carry it. Tags must be singular (see feedback_tag_format).
