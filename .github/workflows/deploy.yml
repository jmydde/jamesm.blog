# Build, check and deploy jamesm.blog.
#
# Runs the same steps as deploy.sh: tag validation, Hugo build, link audit,
# then rsync to the live server. Pull requests get the checks only; a push
# to main (or a manual run) also deploys. The live site is built from what
# is on main, so the repo and the site stay in step.
#
# Repository secrets this needs (Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY      private key for a deploy-only SSH key on the server
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan jamesm.blog`, so the host key is checked
#
# Optional repository variables (same page, Variables tab):
#   DEPLOY_USER         SSH user (default: root, as in deploy.sh)
#   DEPLOY_PATH         target directory (default: the path in deploy.sh)

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the one in flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Match this to `hugo version` on the machine you build on today.
  HUGO_VERSION: "0.159.2"
  # hugo-PaperMod is a gitlink with no .gitmodules entry, so a normal
  # submodule checkout can't fetch it. Pin the same commit explicitly.
  PAPERMOD_REPO: https://github.com/adityatelange/hugo-PaperMod.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Fetch the PaperMod theme at the pinned commit
        run: |
          commit=$(git ls-tree HEAD themes/hugo-PaperMod | awk '{print $3}')
          echo "PaperMod commit: $commit"
          rm -rf themes/hugo-PaperMod
          git init -q themes/hugo-PaperMod
          git -C themes/hugo-PaperMod fetch -q --depth 1 "$PAPERMOD_REPO" "$commit"
          git -C themes/hugo-PaperMod checkout -q FETCH_HEAD

      - name: Install Hugo Extended
        run: |
          curl -fsSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Validate tags
        run: python3 scripts/validate-tags.py

      - name: Build
        run: hugo --cleanDestinationDir

      - name: Audit links
        run: python3 scripts/link-audit.py

      - name: Keep the built site for the deploy job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public/

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Rsync to the live server
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'root' }}
          # Origin host: jamesm.blog is proxied by Cloudflare, which does not pass SSH.
          # Kept in a secret so the origin IP is not published in this public repo.
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/vhosts/jamesm.blog/httpdocs/' }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o HostKeyAlias=jamesm.blog -o ConnectTimeout=20" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/id_deploy
